server:
  port: ${PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/masukibooks}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}  # 'validate' for production, 'update' for dev
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

storage:
  s3:
    endpoint: ${S3_ENDPOINT:https://bbrxdsaojiqdgrdyghih.storage.supabase.co/storage/v1/s3}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:books}
    object-key-prefix: ${S3_OBJECT_KEY_PREFIX:storage/manage/books}
    max-file-size: ${S3_MAX_FILE_SIZE:52428800}
    public-url-prefix: ${S3_PUBLIC_URL_PREFIX:https://bbrxdsaojiqdgrdyghih.supabase.co/storage/v1/object/public/books}

app:
  jwt:
    secret: ${JWT_SECRET:4d8f3a1b9e2c7f5d6a0b4e8f1c3d7a9b2e5f8c1d4a7b0e3f6c9d2a5b8e1f4c7d}
    expiration-ms: ${JWT_EXPIRATION:86400000}       # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@masukibooks.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@2024!}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Super}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Admin}

  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  level:
    com.masukibooks: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
